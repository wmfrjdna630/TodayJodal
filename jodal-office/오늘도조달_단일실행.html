function quoteContract(task, vendor, availableBudget) {
  const total = vendor.total ?? vendor.unit * task.qty;
  const excess = Math.max(0, total - task.limit);
  const special = Boolean(vendor.specialProcurement && excess);
  const agencyShare = special ? total - excess : 0;
  const supportShare = special ? excess : 0;
  const operatingShare = total;

  let reason = '';
  if (!vendor.safe) reason = '안전 기준 부적합으로 계약할 수 없습니다.';
  else if (excess && !special) reason = '기관 요청 한도를 초과합니다.';
  else if (operatingShare > availableBudget) reason = '남은 운영 예산이 부족합니다.';

  return { total, special, agencyShare, supportShare, operatingShare, reason };
}

function task() {
 const schedule = s.round === 1 ? TASKS : s.round % 2 === 0 ? SERVICE_REQUESTS : FESTIVAL_REQUESTS;
 const original = schedule[s.day - 1];
 if (original.crisis) return original;
 const scale = 1 + (s.round - 1) * .12;
 return {...original, unit:Math.round(original.unit * scale), limit:Math.round(original.limit * scale)};
}

function renderTypes(){$('#app').innerHTML=`<div class="layout">${request()}<section class="panel"><small>STEP 01 · 업무 분류</small><h2>어떤 업무에 해당할까요?</h2><p>의뢰를 읽고 알맞은 파일철을 선택하세요.</p><div class="folders">${Object.keys(CATEGORIES).map(type=>`<button class="folder ${s.round===1&&s.day<=3&&type===task().type?'tutorialTarget':''}" data-type="${type}" ${(type==='맞춤공사서비스'&&s.round<RULES.unlockRound)||(isTutorial()&&type!==task().type)?'disabled':''}>${type}<small>${type==='맞춤공사서비스'&&s.round<RULES.unlockRound?'잠김 · 3라운드 시작 이벤트로 해금':'파일 열기 →'}</small></button>`).join('')}</div><p id="typeMessage" role="status" class="notice">물건 구매 · 전문적인 작업 · 시설 공사를 구분해 보세요.</p><button id="backOffice">← 사무실</button></section></div>`;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if((isTutorial()&&b.dataset.type!==task().type)||(b.dataset.type==='맞춤공사서비스'&&s.round<RULES.unlockRound))return;s.selectedType=b.dataset.type;s.phase='vendors';s.category=null;s.vendor=null;render()});$('#backOffice').onclick=()=>{s.phase='office';render()}}
function renderVendors(){const t=task(),offer=selectedOffer(),vs=vendors(),v=vs[s.vendor],type=chosenType(),quote=v&&quoteContract(offer,v,s.budget);$('#app').innerHTML=`<div class="layout">${request()}<section class="panel"><small>STEP 02 · ${type} 분류와 업체 비교</small><h2>의뢰에 맞는 제안을 찾아보세요.</h2><div class="categories">${CATEGORIES[type].map(c=>`<button data-cat="${c}" ${isTutorial()&&c!==t.cat?'disabled':''} class="${s.category===c?'selected':''} ${s.round===1&&s.day<=3&&c===t.cat?'tutorialTarget':''}">${c}</button>`).join('')}</div>${s.category?`<div class="vendors"><div class="document">${v?`<small>업체 제안서 / 견적서</small><h3>${v.name}</h3><div class="product">${artwork(offer.pic,offer.item)}</div><dl><dt>물품·업무</dt><dd>${offer.item} · ${offer.qty}${offer.qty===1?'건':'개'}</dd><dt>기한</dt><dd>${v.days}일 소요 / 요청 ${t.days}일</dd><dt>${v.total ? "평균 단가" : "단가"}</dt><dd>${money(v.unit)}</dd><dt>총액</dt><dd><b>${money(quote.total)}</b></dd><dt>확인 사항</dt><dd>${v.safe?'필수 기준 충족':'필수 안전 기준 부적합'}</dd><dt>특별 정보</dt><dd>${v.special}</dd></dl> ${quote.special?`<p class="notice">특별조달 · 기관 한도 내 금액 <b>${money(quote.agencyShare)}</b> + 특별조달 지원액 <b>${money(quote.supportShare)}</b><br><small>운영 예산에서 합계 ${money(quote.operatingShare)}을 차감합니다.</small></p>`:''}<button id="confirm" class="primary" ${quote.reason?'disabled':''}>${quote.special?'특별조달 계약 확정':'이 업체로 계약 확정'}</button>${quote.reason?`<p class="notice">${quote.reason}</p>`:''}<div id="stampSlot"></div>`:'<div class="empty">오른쪽 업체를 클릭하면<br>상세 제안서가 펼쳐집니다.</div>'}</div><div class="vendorList">${vs.map((x,i)=>`<button class="vendor ${s.vendor===i?'selected':''}" data-v="${i}"><strong>${x.name}</strong><small>${x.desc}</small><br>${x.days}일 · ${x.total ? "혁신조달" : "단가 " + money(x.unit)}<br><small>총액 ${money(x.total ?? x.unit * offer.qty)}</small></button>`).join('')}<p class="muted">혁신제품 지정이 모든 성능의 우위를 뜻하지는 않습니다.</p></div></div>`:'<div class="empty">먼저 물품·업무 카테고리를 선택하세요.</div>'}<div class="actions"><button id="backType">← 업무 분류</button><button id="defer">의뢰 보류</button></div></section></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{if(busy||(isTutorial()&&b.dataset.cat!==t.cat))return;s.category=b.dataset.cat;s.vendor=null;render()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(busy)return;s.vendor=Number(b.dataset.v);render()});$('#backType').onclick=()=>{s.phase='type';render()};$('#defer').onclick=()=>{if(busy)return;finish('이번 의뢰는 보류되었어요. 필요한 서비스가 늦어져 아쉽습니다.',-5,0,0,'의뢰 보류')};if($('#confirm'))$('#confirm').onclick=confirmContract}
function confirmContract(){if(busy||s.phase!=='vendors')return;const t=task(),v=vendors()[s.vendor];if(!v||!CATEGORIES[chosenType()]?.includes(s.category))return;const wrong=chosenType()!==t.type||s.category!==t.cat;if(isTutorial()&&wrong)return;const offer=selectedOffer();const quote=quoteContract(offer,v,s.budget);if(quote.reason)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#stampSlot').innerHTML='<div class="stamp">조달청<br>계약확정</div>';const cost=quote.operatingShare,late=v.days>t.days;s.budget-=cost;s.roundSpend+=cost;if(!wrong)s.completed++;finish((wrong?`요청한 것은 ${t.type} · ${t.cat}인데 ${chosenType()} · ${s.category} (${offer.item}) 계약을 하셨네요. 예산을 썼는데도 필요한 지원을 받지 못했습니다!`:late?'물건이 필요한 날보다 늦게 도착했어요. 다음에는 기한을 꼭 확인해 주세요!':v.policy?'기한에 맞게 잘 준비됐어요! 이번 선택이 새로운 기술과 사회적 가치로도 이어졌네요.':'필요한 때에 꼭 맞는 물품과 서비스를 받았어요. 감사합니다!')+(quote.special?` 특별조달 분담 · 기관 한도 내 ${money(quote.agencyShare)} + 특별조달 ${money(quote.supportShare)}. 운영 예산 지출 ${money(cost)}.`:''),wrong?RULES.wrongContractTrust:late?RULES.badTrust:RULES.goodTrust,!wrong&&v.policy?RULES.policyBonus:0,cost,`${t.agency} · ${v.name}`,false);setTimeout(()=>{busy=false;render()},850)}
function finish(text,trust,policy,cost,title,draw=true,revenue=0){const before=s.trust;s.trust=clamp(s.trust+trust);s.policy+=policy;s.result={text,trust:s.trust-before,policy,cost,title,revenue};s.phase='feedback';s.history.push({round:s.round,day:s.day,...s.result});save();if(draw)render()}
function renderFeedback(){const r=s.result,t=task();$('#app').innerHTML=`<div class="layout"><aside class="panel">${scene(t.crisis?'factory':t.icon)}<h2>${t.crisis?'비축물자 수요기관':t.agency}</h2><div class="news"><b>조달일보</b><p>${news()}</p></div></aside><section class="panel"><small>오늘의 업무 결과</small><h2>${r.title}</h2><p class="reaction">“${r.text}”</p><div class="deltas"><span>공공 신뢰 ${r.trust>=0?'+':''}${r.trust}</span><span>정책 성과 +${r.policy}</span><span>지출 ${money(r.cost)}</span>${r.revenue?`<span>방출 판매대금 +${money(r.revenue)}</span>`:''}</div><p class="muted">선택의 결과를 즉시 보여주기 위해 계약 이후 시간을 생략합니다. 평가 수치는 추후 조정됩니다.</p><button id="nextDay" class="primary">${s.day===10?'라운드 정산하기':'하루 마감 · 다음 날 →'}</button></section></div>`;$('#nextDay').onclick=()=>{if(s.day===10)s.phase='settlement';else{s.day++;s.phase='office';s.selectedType=null;s.category=null;s.vendor=null;s.result=null}render()}}
function normalPrice(r){return Math.round(r.price*(1+(s.round-1)*.08))}
function releasePrice(r){return Math.round(normalPrice(r)*RULES.releasePriceMultiplier)}
function price(r){return Math.round(normalPrice(r)*(s.day>=7&&r.id===resource().id?RULES.crisisPriceMultiplier:1))}
function renderStock(){const locked=s.phase==='feedback'||s.phase==='settlement';$('#app').innerHTML=`<section class="panel"><small>PUBLIC STOCKPILE</small><h2>오늘의 준비가 내일의 위기를 막습니다.</h2><div class="news"><b>조달일보 · DAY ${s.day}</b><p>${news()}</p></div><p class="muted">1톤 단위 구매 · 라운드가 바뀌어도 재고는 유지됩니다. 구매는 운영 예산에서 차감됩니다. 이번 라운드 위기 수요는 20톤입니다.</p>${locked?'<p class="notice">오늘 업무가 끝났습니다. 다음 날 업무 시작 전에 비축할 수 있습니다.</p>':''}<div class="stockGrid">${RESOURCES.map(r=>`<article class="panel stockCard"><div class="stockIcon">${artwork(r.icon)}</div><h3>${r.name}</h3><strong>${s.inventory[r.id]}톤</strong><p>현재 시장 구매가 ${money(price(r))} / 톤</p><p class="muted">평시 기준가 ${money(normalPrice(r))} · 위기 시 방출 판매가 ${money(releasePrice(r))} / 톤</p><label>${r.name} 구매량 <input id="qty-${r.id}" type="number" min="1" max="100" step="1" value="5" ${locked?'disabled':''}></label><button data-buy="${r.id}" ${locked?'disabled':''}>비축 구매</button></article>`).join('')}</div><p id="stockMessage" role="status"></p><div class="actions"><button id="returnOffice">← 진행 중인 업무로 돌아가기</button></div></section>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const r=RESOURCES.find(x=>x.id===b.dataset.buy),qty=Number($('#qty-'+r.id).value),cost=qty*price(r);if(locked||!Number.isInteger(qty)||qty<1||qty>100){$('#stockMessage').textContent='구매량은 1~100톤 사이 정수로 입력하세요.';return}if(cost>s.budget){$('#stockMessage').textContent='운영 예산이 부족합니다. 구매량을 줄여 주세요.';return}s.budget-=cost;s.stockSpend+=cost;s.inventory[r.id]+=qty;s.history.push({round:s.round,day:s.day,title:`공공비축 · ${r.name} ${qty}톤 구매`,text:`${money(cost)} 지출`,cost});render();$('#stockMessage').textContent=`${r.name} ${qty}톤을 창고에 비축했습니다.`});$('#returnOffice').onclick=()=>{tab='office';render()}}
function supplyReserve(emergency=false){
 if(s.phase!=='office'||!task().crisis||busy)return;
 const r=resource(),have=s.inventory[r.id],n=emergency?20:Math.min(20,have),missing=emergency?Math.max(0,20-have):0,cost=missing*price(r),revenue=n*releasePrice(r);
 // 긴급 구매를 먼저 결제한 뒤 판매합니다. 아직 받지 않은 판매대금을 선결제에 쓰지 않습니다.
 if(cost>s.budget||n===0)return;
 s.inventory[r.id]=Math.max(0,have-n);s.budget+=revenue-cost;s.roundSpend+=cost;s.stockRevenue+=revenue;
 const text=missing?'긴급 구매와 방출 판매로 필요한 물량을 받았어요. 다만 높은 구매가 때문에 운영 예산 부담이 컸겠네요.':n===20?'미리 비축한 물자를 시장가보다 저렴하게 구매해 생산을 이어갈 수 있었어요!':`${n}톤을 저렴하게 구매했지만 아직 필요한 물량이 부족해요.`;
 finish(text,n===20?(missing?6:10):-4,0,cost,`${r.name} ${n}톤 방출 판매`,true,revenue);
}
function renderCrisis(){const r=resource(),have=s.inventory[r.id],n=Math.min(20,have),missing=Math.max(0,20-have),cost=missing*price(r),unit=releasePrice(r);$('#app').innerHTML=`<div class="layout"><aside class="panel">${scene('factory')}<h2>긴급 원자재 공급 요청</h2><p>${r.name} 공급이 끊겨 생산이 멈출 위기예요. 20톤을 확보해 주실 수 있나요?</p><div class="news"><b>속보</b><p>${news()}</p></div></aside><section class="panel"><span class="tag">공공비축 · 방출 판매</span><h2>비축물자를 낮은 가격에 판매해 기업을 지원하세요.</h2><p>${r.name} 보유량 <b>${have}톤</b> / 필요량 <b>20톤</b></p><div class="reportRow"><span>평시 기준 구매가</span><b>${money(normalPrice(r))} / 톤</b></div><div class="reportRow"><span>현재 시장가</span><b>${money(price(r))} / 톤</b></div><div class="reportRow"><span>기업에 방출하는 판매가</span><b>${money(unit)} / 톤</b></div><p>보유 물량 ${n}톤 판매대금: <b>+${money(n*unit)}</b></p><p>전량 공급 시: 긴급 구매 지출 ${money(cost)} / 판매대금 ${money(20*unit)}</p><div class="actions"><button class="primary" id="release" ${n===0?'disabled':''}>보유 ${n}톤 방출 판매</button><button id="emergency" ${cost>s.budget?'disabled':''}>${missing?'부족분 긴급 구매 후 20톤 판매':'비축 20톤 전량 판매'}</button><button id="delay">공급 지연</button></div>${cost>s.budget?'<p class="notice">긴급 구매를 먼저 결제할 운영 예산이 부족합니다.</p>':''}<p class="notice">방출 판매대금은 운영 예산으로 들어옵니다. 시장가가 높을 때 긴급 구매해 낮은 가격에 판매하면 손실이 발생하므로 미리 비축하는 것이 유리합니다.</p><p class="muted">현재 가격은 임시 게임 규칙입니다. 실제 공공비축의 가격 결정·회계 절차를 재현한 것은 아닙니다.</p></section></div>`;$('#release').onclick=()=>supplyReserve(false);$('#emergency').onclick=()=>supplyReserve(true);$('#delay').onclick=()=>{if(s.phase!=='office')return;finish('원자재를 확보하지 못해 생산 일정이 늦어졌어요.',-12,0,0,`${r.name} 공급 지연`)}}

function grant(){return RULES.baseGrant+s.trust*RULES.trustGrant}
function renderSettlement(){const next=grant();$('#app').innerHTML=`<section class="panel report"><small>ROUND ${s.round} · 운영 보고서</small><h2>열흘 동안, 어떤 내일을 만들었나요?</h2><div class="reportRow"><span>라운드 시작 예산</span><b>${money(s.roundOpening)}</b></div><div class="reportRow"><span>의뢰·위기 대응 지출</span><b>−${money(s.roundSpend)}</b></div><div class="reportRow"><span>공공비축 구매 지출</span><b>−${money(s.stockSpend)}</b></div><div class="reportRow"><span>공공비축 방출 판매대금</span><b>+${money(s.stockRevenue)}</b></div><div class="reportRow"><span>남은 예산 · 다음 라운드 이월</span><b>${money(s.budget)}</b></div><div class="reportRow"><span>공공 신뢰</span><b>${s.roundStartTrust} → ${s.trust}</b></div><div class="reportRow"><span>이번 라운드 정책 성과</span><b>+${s.policy-s.roundStartPolicy}점</b></div><div class="reportRow"><span>다음 라운드 신규 배정</span><b>+${money(next)}</b></div><div class="reportRow"><span>다음 시작 예산</span><b>${money(s.budget+next)}</b></div><p class="notice">임시 배정 규칙: 기본 ${money(RULES.baseGrant)} + 공공 신뢰 1점당 ${money(RULES.trustGrant)}. 남은 예산과 비축 재고는 전부 이월됩니다.</p>${s.round+1===RULES.unlockRound?'<p class="notice">다음 라운드에 맞춤공사서비스가 해금됩니다.</p>':''}<button class="primary" id="nextRound">ROUND ${s.round+1} · 새로운 열흘 시작 →</button></section>`;$('#nextRound').onclick=()=>{const unlock=s.round+1===RULES.unlockRound;s.budget+=next;s.round++;s.day=1;s.phase='office';s.selectedType=null;s.category=null;s.vendor=null;s.result=null;s.roundSpend=0;s.stockSpend=0;s.stockRevenue=0;s.completed=0;s.roundStartTrust=s.trust;s.roundStartPolicy=s.policy;s.roundOpening=s.budget;render();if(unlock)modal('<h2>맞춤공사서비스 해금</h2><p>신뢰를 쌓으며 새로운 업무를 맡게 되었습니다. 이번 라운드부터 기획·설계·시공을 연결하는 사업관리 의뢰가 등장합니다.</p>')}}
$('#officeTab').onclick=()=>{if(!busy){tab='office';render()}};$('#stockTab').onclick=()=>{if(!busy&&s.phase!=='settlement'){tab='stock';render()}};$('#logTab').onclick=()=>modal('<h2>업무 기록</h2>'+([...s.history].reverse().map(h=>`<div class="log"><small>ROUND ${h.round} · DAY ${h.day}</small><br><b>${escapeHtml(h.title)}</b><p>${escapeHtml(h.text)}</p></div>`).join('')||'<p>아직 처리한 업무가 없습니다.</p>'));$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close()};$('#reset').onclick=()=>{if(busy)return;modal('<h2>새 게임을 시작할까요?</h2><p>현재 라운드, 예산, 비축 재고와 업무 기록이 초기화됩니다.</p><button id="resetYes" class="primary">초기화하고 시작</button>');$('#resetYes').onclick=()=>{s=fresh();tab='office';$('#modal').close();render()}};$('#help').onclick=()=>modal('<h2>사무실에 오신 것을 환영해요.</h2><ol><li>방문자의 대사와 힌트에서 필요한 것을 파악하세요.</li><li>책상 파일철을 열고 업무 종류와 카테고리를 선택하세요.</li><li>업체의 기한·단가·특별 정보를 비교하고 계약하세요.</li><li>매일 뉴스를 읽고 별도 공공비축 창고에서 자원을 준비하세요.</li><li>10일마다 정산하고 신뢰에 따른 새 예산으로 다음 라운드를 시작하세요.</li></ol><p>3라운드부터 맞춤공사서비스가 해금됩니다. 종료 라운드와 시간 제한은 없습니다.</p><p>평가 수치와 예산은 임시 게임 규칙입니다. 실제 조달 절차와 제도는 단순화했습니다. 캐릭터와 물품 이미지는 최종 디자인을 위한 이모지 자리 표시입니다.</p><p>이 브라우저에 저장됩니다. 파일 이동이나 브라우저 변경 시 저장이 이어지지 않을 수 있습니다.</p>');render();
</script></body></html>
